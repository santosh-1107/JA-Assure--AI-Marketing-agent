brand: "Jade"
jurisdiction: "Regional Insurance Advertising Standards"
rules:
  - id: "NO_GUARANTEED_PAYOUT"
    tier: "REGULATORY"
    category: "Regulatory Prohibition on Guaranteed Outcomes"
    description: "Prohibits any promise of guaranteed claim payouts, unconditional settlements, or instant cash without standard assessment."
    severity: "CRITICAL"
    trigger_patterns:
      - "guaranteed payout"
      - "guaranteed payouts"
      - "instant payout guaranteed"
      - "guaranteed claim payment"
      - "always pays out"
      - "claims are never denied"
      - "100% claim approval"
    fail_message: "The content claims or implies guaranteed claim payouts. Insurance regulations require all payout statements to clarify that settlements depend on underwriting review and claim assessment."

  - id: "NO_GUARANTEED_PROTECTION"
    tier: "REGULATORY"
    category: "Regulatory Prohibition on Absolute Protection"
    description: "Prohibits absolute or superlative protection guarantees such as '100% protected', 'zero risk', or 'bulletproof defense'."
    severity: "CRITICAL"
    trigger_patterns:
      - "100% protected"
      - "100% protection"
      - "zero risk"
      - "completely risk-free"
      - "bulletproof protection"
      - "absolute guarantee"
      - "never worry again"
    fail_message: "The content uses absolute protection terminology ('100% protected' or 'zero risk'). No insurance policy covers every conceivable loss scenario."

  - id: "QUALIFIED_COVERAGE_CLAIMS"
    tier: "REGULATORY"
    category: "Regulatory Disclosure Requirements"
    description: "Coverage descriptions must include appropriate qualification (e.g., 'subject to policy terms and conditions')."
    severity: "MODERATE"
    required_phrases:
      - "subject to policy terms"
      - "terms and conditions"
      - "underwriter schedule"
      - "policy limits apply"
      - "subject to assessment"
    fail_message: "Coverage scope is stated as an absolute without necessary regulatory disclosures. Marketing assets must include 'subject to policy terms and conditions' or equivalent qualifiers."

  - id: "NO_MISLEADING_OR_UNSUPPORTED_CLAIMS"
    tier: "REGULATORY"
    category: "Truth in Advertising Standards"
    description: "Prohibits unsubstantiated market ranking superlatives (e.g., '#1 insurer in Asia') without verifiable independent citation."
    severity: "HIGH"
    trigger_patterns:
      - "#1 insurer in asia"
      - "number one luxury insurer"
      - "cheapest insurance in singapore"
      - "highest payout rate in the world"
    fail_message: "The content contains unverified superlatives or market dominance claims without independent accreditation."

  - id: "INAPPROPRIATE_SALES_LANGUAGE"
    tier: "BRAND_POLICY"
    category: "JA Assure Fair Dealing Policy"
    description: "Prohibits high-pressure fearmongering, countdown deadlines, or aggressive sales tactics inconsistent with private wealth advisory."
    severity: "HIGH"
    trigger_patterns:
      - "buy before midnight"
      - "before you lose everything"
      - "insane limited-time offer"
      - "act now or face ruin"
      - "flash sale"
    fail_message: "The content employs aggressive sales pressure or fearmongering tactics, violating internal brand standards."

  - id: "OFF_BRAND_TONE"
    tier: "BRAND_POLICY"
    category: "JA Assure Brand Persona Guidelines"
    description: "Jade content must maintain an understated, luxury, bespoke tone and avoid clinical medical jargon or mass-market slang."
    severity: "MODERATE"
    trigger_patterns:
      - "medical malpractice"
      - "clinical negligence"
      - "doctor indemnity"
      - "cheap deal"
      - "bargain coverage"
    fail_message: "The content contains language misaligned with the Jade brand persona (detected clinical jargon or mass-market discount terminology)."
