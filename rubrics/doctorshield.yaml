brand: "DoctorShield"
jurisdiction: "Healthcare Professional Indemnity & Advertising Standards"
rules:
  - id: "NO_GUARANTEED_LEGAL_OUTCOME"
    tier: "REGULATORY"
    category: "Regulatory Prohibition on Guaranteed Legal Outcomes"
    description: "Prohibits guaranteeing court dismissal, disciplinary exoneration, or zero malpractice liability."
    severity: "CRITICAL"
    trigger_patterns:
      - "guaranteed dismissal"
      - "guaranteed verdict"
      - "never face liability"
      - "guaranteed payout"
      - "instant compensation"
      - "always win against patients"
    fail_message: "The content claims or implies guaranteed legal dismissal or zero medical liability. Medico-legal outcomes cannot be guaranteed under regulatory ethics guidelines."

  - id: "NO_UNQUALIFIED_IMMUNITY"
    tier: "REGULATORY"
    category: "Regulatory Prohibition on Absolute Immunity"
    description: "Prohibits asserting practitioners are '100% immune' or 'shielded from every investigation'."
    severity: "CRITICAL"
    trigger_patterns:
      - "100% immune"
      - "100% protected"
      - "zero risk of disciplinary action"
      - "bulletproof protection"
      - "complete immunity"
    fail_message: "The content claims 100% immunity from medical malpractice claims or disciplinary inquiries. Indemnity provides defense counsel and indemnification, not statutory immunity."

  - id: "QUALIFIED_COVERAGE_CLAIMS"
    tier: "REGULATORY"
    category: "Regulatory Disclosure Requirements"
    description: "Scope of indemnity defense costs and retroactive dates must state that coverage is subject to policy wording and schedule."
    severity: "MODERATE"
    required_phrases:
      - "subject to policy terms"
      - "terms and conditions"
      - "policy schedule"
      - "underwriting criteria"
      - "subject to assessment"
    fail_message: "Coverage terms must explicitly state that indemnity benefits and legal defense costs are 'subject to policy terms and conditions'."

  - id: "NO_MISLEADING_STATISTICS"
    tier: "REGULATORY"
    category: "Truth in Clinical Reporting Standards"
    description: "Prohibits fabricating medical litigation statistics or unverified lawsuit frequencies."
    severity: "HIGH"
    trigger_patterns:
      - "90% of doctors are sued"
      - "all surgeons will face trial"
      - "unbeatable payout rate"
    fail_message: "The content references unsubstantiated malpractice litigation claims or exaggerated statistical risks without verified clinical sources."

  - id: "INAPPROPRIATE_SALES_LANGUAGE"
    tier: "BRAND_POLICY"
    category: "JA Assure Professional Medical Dignity Policy"
    description: "Prohibits sensationalist fearmongering targeting physicians ('Patients will sue you tomorrow', 'License revocation alert')."
    severity: "HIGH"
    trigger_patterns:
      - "patients will sue you tomorrow"
      - "before your license is stripped"
      - "insane medical discount"
      - "act fast or lose your clinic"
    fail_message: "The content employs sensationalist scare tactics incompatible with professional medical communication standards."

  - id: "OFF_BRAND_TONE"
    tier: "BRAND_POLICY"
    category: "JA Assure Brand Persona Guidelines"
    description: "DoctorShield content must maintain a clinical, objective, and authoritative tone, avoiding jewelry/luxury lifestyle themes."
    severity: "MODERATE"
    trigger_patterns:
      - "luxury heirloom"
      - "sparkling jewelry"
      - "bespoke diamond"
      - "opulent lifestyle"
    fail_message: "The content introduces luxury jewelry or lifestyle concepts, which conflict directly with the DoctorShield clinical indemnity brand."
